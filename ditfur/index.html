<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Login Pengelola - Portal Ditfur</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f8fafc;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .badge-lock {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .login-header h2 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .login-header p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i.left-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 14px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: all 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            background: rgba(15, 23, 42, 0.9);
        }

        .toggle-pw {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            cursor: pointer;
            font-size: 14px;
        }
        .toggle-pw:hover { color: #cbd5e1; }

        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 12px;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
        }

        .btn-back-public {
            color: #94a3b8;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: color 0.2s;
        }
        .btn-back-public:hover { color: #ffffff; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="badge-lock">
                <i class="fa-solid fa-user-shield"></i> Portal Ditfur Access
            </div>
            <h2>Login Adit</h2>
            <p>Masukkan ID Angka dan Password untuk mengelola Keuangan & Jadwal.</p>
        </div>

        <div id="errorMessage" class="error-message">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="errorText">ID atau Password salah!</span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginId"><i class="fa-solid fa-id-card"></i> ID Pengguna (Angka):</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user left-icon"></i>
                    <input type="text" id="loginId" placeholder="Masukkan ID angka..." required autofocus autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label for="loginPw"><i class="fa-solid fa-key"></i> Kata Sandi (Password):</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock left-icon"></i>
                    <input type="password" id="loginPw" placeholder="Masukkan kata sandi..." required>
                    <i class="fa-solid fa-eye toggle-pw" id="togglePwBtn" onclick="togglePassword()"></i>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk ke Portal Ditfur
            </button>
        </form>

        <div class="login-footer">
            <a href="../index.html" class="btn-back-public">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Tampilan Publik
            </a>
        </div>
    </div>

    <script>
        // Redirect jika sudah login
        if (sessionStorage.getItem("ditfur_auth") === "true") {
            window.location.href = "money.html";
        }

        function togglePassword() {
            const pwInput = document.getElementById("loginPw");
            const toggleBtn = document.getElementById("togglePwBtn");
            if (pwInput.type === "password") {
                pwInput.type = "text";
                toggleBtn.classList.remove("fa-eye");
                toggleBtn.classList.add("fa-eye-slash");
            } else {
                pwInput.type = "password";
                toggleBtn.classList.remove("fa-eye-slash");
                toggleBtn.classList.add("fa-eye");
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const idInput = document.getElementById("loginId").value.trim();
            const pwInput = document.getElementById("loginPw").value.trim();
            const errorBox = document.getElementById("errorMessage");
            const errorText = document.getElementById("errorText");

            const TARGET_ID = "24214160905";
            const TARGET_PW = "16090524214";

            if (idInput === TARGET_ID && pwInput === TARGET_PW) {
                sessionStorage.setItem("ditfur_auth", "true");
                window.location.href = "money.html";
            } else {
                errorBox.style.display = "flex";
                errorText.textContent = "ID atau Password salah! Periksa kembali kredensial Anda.";
                document.getElementById("loginPw").value = "";
            }
        }
    </script>
</body>
</html>
