    <!-- Auth Security Guard -->
    <script>
        function checkAuth() {
            if (sessionStorage.getItem("ditfur_auth") !== "true") {
                let id = prompt("🔐 Masukkan ID Pengguna (Angka):");
                let pw = prompt("🔑 Masukkan Kata Sandi (Password):");
                if (id === "24214160905" && pw === "16090524214") {
                    sessionStorage.setItem("ditfur_auth", "true");
                } else {
                    alert("❌ Login Gagal! ID atau Password salah.");
                    window.location.href = "index.html";
                }
            }
        }
        checkAuth();

        function logout() {
            if (confirm("Apakah Anda yakin ingin keluar dari Sesi Pengelola?")) {
                sessionStorage.removeItem("ditfur_auth");
                window.location.href = "index.html";
            }
        }
    </script>

    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary: #4a90e2;
            --accent-magang: #e67e22;
            --accent-latih: #2ecc71;
            --accent-kuliah: #9b59b6;
            --accent-bisnis: #00ced1;
            --accent-libur: #95a5a6;
            --border-radius: 12px;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 30px 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 26px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .btn-excel {
            background-color: #107c41;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-excel:hover {
            background-color: #0b592e;
        }

        /* Navigasi Minggu */
        .week-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .week-btn {
            background-color: #e2e8f0;
            color: #4a5568;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .week-btn.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
        }

        .form-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }

        .form-box h3 {
            margin-bottom: 15px;
            color: #444;
            font-size: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #357abd;
        }

        .btn-cancel {
            background-color: #e2e8f0;
            color: #333;
            border: none;
            margin-top: 5px;
            cursor: pointer;
            display: none;
        }

            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border-left: 5px solid var(--primary);

            border-left-color: var(--accent-libur);
        }

            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
        }

        .day-date {
            font-size: 14px;
            color: #718096;
            font-weight: normal;
        }

        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .activity-item {

            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-radius: 10px;
            background-color: #f8fafc;
            border: 1px solid #edf2f7;

            border-left: 6px solid #10b981;

        .item-latih:hover {

            background: linear-gradient(135deg, #faf5ff 0%, #ffffff 100%);

            border-left: 5px solid #a855f7;
        }

        .item-bisnis {
            background: linear-gradient(135deg, #ecfeff 0%, #ffffff 100%);
            border: 1px solid #a5f3fc;
            border-left: 5px solid #06b6d4;
        }

        .item-libur {
            background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
            border: 1px solid #e2e8f0;
            border-left: 5px solid #94a3b8;
        }

        .activity-info {

            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .activity-time {
            font-weight: 700;
            font-size: 12px;
            color: #334155;
            background: white;
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;

            text-align: center;

        .activity-name {

            font-weight: 700;
            color: #1e293b;
        }

        .item-latih .activity-name {

        .badge {

            padding: 4px 12px;
            border-radius: 20px;
            color: white;
            font-weight: 800;
            display: inline-flex;
            align-items: center;

        .badge-kuliah {

        }

        .badge-bisnis {
            background: linear-gradient(135deg, #06b6d4 0%, #0e7490 100%);
        }

        .badge-libur {
            background: linear-gradient(135deg, #64748b 0%, #334155 100%);

        .action-btns {
            display: flex;
            gap: 5px;
        }

        .btn-action {
            width: auto;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn-edit {
            background-color: #f1c40f;
            color: #333;
            font-weight: 500;
        }

        .btn-edit:hover { background-color: #f39c12; }

        .btn-delete {
            background-color: #ff7675;
        }

        .btn-delete:hover { background-color: #d63031; }

        .btn-toggle-public {
            width: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 20px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .btn-toggle-public.is-public {
            background-color: #e6f4ea;
            color: #137333;
            border: 1px solid #ceead6;
        }
        .btn-toggle-public.is-public:hover {
            background-color: #ceead6;
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-toggle-public.is-private {
            background-color: #fce8e6;
            color: #c5221f;
            border: 1px solid #fad2cf;
        }
        .btn-toggle-public.is-private:hover {
            background-color: #fad2cf;
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .day-card.card-private {
            opacity: 0.88;
            background: #fafbfc;
            border-left: 5px solid #cbd5e1;
        }

        .status-pill-private {
            font-size: 11px;
            background: #fee2e2;
            color: #991b1b;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .status-pill-public {
            font-size: 11px;
            background: #dcfce7;
            color: #166534;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .btn-mass {
            width: auto;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 20px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-mass:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        }
        .btn-mass-pub-week { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
        .btn-mass-priv-week { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
        .btn-mass-pub-all { background: #2563eb; color: white; }
        .btn-mass-priv-all { background: #475569; color: white; }

        @media (max-width: 600px) {
            .activity-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .action-btns {
                align-self: flex-end;
            }
        }
    </style>
</head>

<div class="container">
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">

        <div style="font-weight: 700; color: #334155; font-size: 13px; display: flex; align-items: center; gap: 6px;">
            ⚡ Aksi Massal Status Publikasi:

<script>
    // Mapping Kalender Baru: 5 Minggu (Juli - Agustus 2026)
    const tanggalMapping = {
        1: { "Senin": "27 Jul", "Selasa": "28 Jul", "Rabu": "29 Jul", "Kamis": "30 Jul", "Jumat": "31 Jul", "Sabtu": "1 Ags", "Minggu": "2 Ags" },

        5: { "Senin": "24 Ags", "Selasa": "25 Ags", "Rabu": "26 Ags", "Kamis": "27 Ags", "Jumat": "28 Ags", "Sabtu": "29 Ags", "Minggu": "30 Ags", "Senin_31": "31 Ags" }
    };

    // Template Default Awal
    const templateRutin = {
        "Senin": [
            { waktu: "07:00 - 15:00", nama: "Magang (Full Day)", kategori: "magang" },
            { waktu: "15:30 - 17:00", nama: "Melatih SMP 1", kategori: "latih" }

        "Selasa": [

        ],
        "Rabu": [
            { waktu: "07:00 - 15:00", nama: "Magang (Full Day)", kategori: "magang" }
        ],
        "Kamis": [
            { waktu: "07:00 - 15:00", nama: "Magang (Full Day)", kategori: "magang" }
        ],
        "Jumat": [
            { waktu: "10:00 - 11:00", nama: "Melatih SD Namira", kategori: "latih" },
            { waktu: "15:30 - Selesai", nama: "Melatih Patokan 1 (Sore)", kategori: "latih" }

            { waktu: "09:30 - 13:00", nama: "Melatih SMP 1", kategori: "latih" }

        "Minggu": [

    let databaseJadwal = {};
    let bulanAktif = "Agustus 2026";

    let currentEditHari = "";
    let currentEditIndex = null;
    const hariUrutanDasar = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu", "Minggu"];

    const STORAGE_KEY = "jadwalAgustus_Bulanan_v3";

    // --- NORMALIZE & STRUCTURE MIGRATION ---
    function getDefaultMonthData() {
        let def = {};
        for (let w = 1; w <= 5; w++) {
            def[w] = JSON.parse(JSON.stringify(templateRutin));
        }
        def[5]["Senin_31"] = [
            { waktu: "07:00 - 15:00", nama: "Magang (Full Day)", kategori: "magang" },

        ];
        return def;
    }

    function normalizeDatabaseStructure() {
        if (!databaseJadwal) databaseJadwal = {};
        if (!databaseJadwal.bulanList) databaseJadwal.bulanList = ["Agustus 2026"];
        if (!databaseJadwal.bulanAktif) databaseJadwal.bulanAktif = "Agustus 2026";
        if (!databaseJadwal.dataBulan) databaseJadwal.dataBulan = {};
        if (!databaseJadwal.publicStatus) databaseJadwal.publicStatus = {};

        bulanAktif = databaseJadwal.bulanAktif;

        if (!databaseJadwal.dataBulan["Agustus 2026"]) {
            databaseJadwal.dataBulan["Agustus 2026"] = {};
            for (let w = 1; w <= 5; w++) {
                if (databaseJadwal[w]) {
                    databaseJadwal.dataBulan["Agustus 2026"][w] = databaseJadwal[w];
                } else {
                    databaseJadwal.dataBulan["Agustus 2026"][w] = JSON.parse(JSON.stringify(templateRutin));
                }
            }
        }

        if (!databaseJadwal.dataBulan[bulanAktif]) {
            databaseJadwal.dataBulan[bulanAktif] = getDefaultMonthData();
        }
    }

    // --- FIREBASE CONFIGURATION & INITIALIZATION ---
    const firebaseConfig = {
        apiKey: "AIzaSyBiNwS8pU3D6iF5gTmM95kzMIy-tm_sTIY",
        authDomain: "rentalhtkraksaan-61397.firebaseapp.com",
        databaseURL: "https://rentalhtkraksaan-61397-default-rtdb.firebaseio.com",
        projectId: "rentalhtkraksaan-61397",
        storageBucket: "rentalhtkraksaan-61397.appspot.com",
        messagingSenderId: "665290802617",
        appId: "1:665290802617:web:efb004f474218e443fa268"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = app.database();
    const auth = app.auth();

    const JADWAL_PATH = 'keuangan/jadwal';
    const jadwalRef = db.ref(JADWAL_PATH);

    // Initial local fallback load
    if (localStorage.getItem(STORAGE_KEY)) {
        try {
            databaseJadwal = JSON.parse(localStorage.getItem(STORAGE_KEY));
            normalizeDatabaseStructure();
        } catch (e) {
            databaseJadwal = getDefaultJadwalData();
        }
    } else {
        databaseJadwal = getDefaultJadwalData();
    }

    function getDefaultJadwalData() {
        let def = {
            bulanAktif: "Agustus 2026",
            bulanList: ["Agustus 2026"],
            dataBulan: {
                "Agustus 2026": getDefaultMonthData()
            },
            publicStatus: {}
        };
        return def;
    }

    auth.signInAnonymously()
        .then(() => {
            console.log("✅ Login anonim Firebase untuk Jadwal berhasil");
            listenForJadwalFirebase();
        })
        .catch((error) => {
            console.error("❌ Login Firebase gagal, menggunakan penyimpanan lokal:", error);
            const statusElem = document.getElementById('firebaseStatus');
            if (statusElem) statusElem.textContent = "📁 Mode Offline (Lokal)";
        });

    function listenForJadwalFirebase() {
        jadwalRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const statusElem = document.getElementById('firebaseStatus');
            if (data) {
                databaseJadwal = data;
                normalizeDatabaseStructure();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(databaseJadwal));
                if (statusElem) statusElem.textContent = "🔥 Firebase Realtime Synced";
            } else {
                simpanData(true);
                if (statusElem) statusElem.textContent = "🔥 Firebase Initialized";
            }
            renderBulanSelector();
            renderJadwal();
        }, (error) => {
            console.error("Gagal membaca Firebase Jadwal:", error);
            const statusElem = document.getElementById('firebaseStatus');
            if (statusElem) statusElem.textContent = "⚠️ Firebase Offline";
        });
    }

    function simpanData(syncToFirebase = true) {
        normalizeDatabaseStructure();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(databaseJadwal));
        if (syncToFirebase && firebase.apps.length) {
            jadwalRef.set(databaseJadwal)
                .catch(err => console.error("Gagal simpan ke Firebase:", err));
        }
    }

    function simpanKeLokal() {
        simpanData(true);
    }

    function gantiBulan(namaBulan) {
        normalizeDatabaseStructure();
        if (databaseJadwal.dataBulan[namaBulan]) {
            databaseJadwal.bulanAktif = namaBulan;
            bulanAktif = namaBulan;
            simpanKeLokal();
            renderBulanSelector();
            renderJadwal();
        }
    }

    function renderBulanSelector() {
        normalizeDatabaseStructure();
        const select = document.getElementById("bulanSelector");
        if (select) {
            select.innerHTML = "";
            databaseJadwal.bulanList.forEach(b => {
                const opt = document.createElement("option");
                opt.value = b;
                opt.textContent = b;
                if (b === bulanAktif) opt.selected = true;
                select.appendChild(opt);
            });
        }
        const headerTitle = document.getElementById("headerBulanTitle");
        if (headerTitle) {
            headerTitle.textContent = `🛠️ Editor Jadwal Bulanan (${bulanAktif})`;
        }
    }

    function tambahBulanBaru() {
        const namaBulan = prompt("Masukkan nama bulan baru (Contoh: September 2026):");
        if (!namaBulan || !namaBulan.trim()) return;
        const bulanClean = namaBulan.trim();
        
        normalizeDatabaseStructure();
        if (databaseJadwal.bulanList.includes(bulanClean)) {
            alert("Bulan ini sudah ada dalam daftar!");
            gantiBulan(bulanClean);
            return;
        }
        
        databaseJadwal.bulanList.push(bulanClean);
        databaseJadwal.dataBulan[bulanClean] = getDefaultMonthData();
        databaseJadwal.bulanAktif = bulanClean;
        bulanAktif = bulanClean;
        
        simpanKeLokal();
        renderBulanSelector();
        renderJadwal();
    }

    function hapusBulanAktif() {
        normalizeDatabaseStructure();
        if (databaseJadwal.bulanList.length <= 1) {
            alert("Tidak dapat menghapus satu-satunya bulan yang tersisa!");
            return;
        }
        if (confirm(`Apakah Anda yakin ingin menghapus seluruh jadwal untuk bulan ${bulanAktif}?`)) {
            delete databaseJadwal.dataBulan[bulanAktif];
            databaseJadwal.bulanList = databaseJadwal.bulanList.filter(b => b !== bulanAktif);
            databaseJadwal.bulanAktif = databaseJadwal.bulanList[0];
            bulanAktif = databaseJadwal.bulanAktif;
            
            simpanKeLokal();
            renderBulanSelector();
            renderJadwal();
        }
    }

    function gantiMinggu(nomorMinggu) {
        mingguAktif = nomorMinggu;
        document.querySelectorAll('.week-btn').forEach((btn, idx) => {
            if (idx + 1 === nomorMinggu) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        batalEdit();
        renderJadwal();
    }

    function isDayPublic(minggu, hari) {
        normalizeDatabaseStructure();
        const keyWithMonth = `${bulanAktif}_${minggu}_${hari}`;
        const legacyKey = `${minggu}_${hari}`;
        if (databaseJadwal.publicStatus[keyWithMonth] !== undefined) {
            return databaseJadwal.publicStatus[keyWithMonth] === true;
        }
        if (databaseJadwal.publicStatus[legacyKey] !== undefined) {
            return databaseJadwal.publicStatus[legacyKey] === true;
        }
        return true;
    }

    function setDayPublic(minggu, hari, setPublic) {
        normalizeDatabaseStructure();
        const keyWithMonth = `${bulanAktif}_${minggu}_${hari}`;
        databaseJadwal.publicStatus[keyWithMonth] = setPublic;
    }

    function togglePublicHari(minggu, hari) {
        const currentStatus = isDayPublic(minggu, hari);
        setDayPublic(minggu, hari, !currentStatus);
        simpanKeLokal();
        renderJadwal();
    }

    function publishMingguIni(setPublic) {
        normalizeDatabaseStructure();
        let urutanHari = [...hariUrutanDasar];
        if (mingguAktif === 5) urutanHari.push("Senin_31");
        urutanHari.forEach(hari => {
            setDayPublic(mingguAktif, hari, setPublic);
        });
        simpanKeLokal();
        renderJadwal();
    }

    function publishSemuaMassal(setPublic) {
        normalizeDatabaseStructure();
        for (let w = 1; w <= 5; w++) {
            let urutanHari = [...hariUrutanDasar];
            if (w === 5) urutanHari.push("Senin_31");
            urutanHari.forEach(hari => {
                setDayPublic(w, hari, setPublic);
            });
        }
        simpanKeLokal();
        renderJadwal();
    }

    function dapatkanMenitMulai(waktuStr) {
        const match = waktuStr.match(/(\d{1,2})[:.](\d{2})/);
        if (match) return parseInt(match[1]) * 60 + parseInt(match[2]);
        if (waktuStr.toLowerCase().includes("pagi")) return 0;
        if (waktuStr.toLowerCase().includes("siang")) return 720;
        if (waktuStr.toLowerCase().includes("sore")) return 900;
        return 9999; 
    }

    function getDaftarKegiatan(minggu, hari) {
        normalizeDatabaseStructure();
        if (!databaseJadwal.dataBulan[bulanAktif]) {
            databaseJadwal.dataBulan[bulanAktif] = getDefaultMonthData();
        }
        if (!databaseJadwal.dataBulan[bulanAktif][minggu]) {
            databaseJadwal.dataBulan[bulanAktif][minggu] = {};
        }
        if (!databaseJadwal.dataBulan[bulanAktif][minggu][hari]) {
            databaseJadwal.dataBulan[bulanAktif][minggu][hari] = [];
        }
        return databaseJadwal.dataBulan[bulanAktif][minggu][hari];
    }

    function renderJadwal() {
        normalizeDatabaseStructure();
        const container = document.getElementById("jadwalContainer");
        container.innerHTML = "";

        let urutanHari = [...hariUrutanDasar];
        if (mingguAktif === 5) urutanHari.push("Senin_31");

        urutanHari.forEach(hari => {
            const listKegiatan = getDaftarKegiatan(mingguAktif, hari);
            listKegiatan.sort((a, b) => dapatkanMenitMulai(a.waktu) - dapatkanMenitMulai(b.waktu));
            
            const namaHariTampilan = hari.startsWith("Senin_31") ? "Senin" : hari;
            const tanggalTeks = (tanggalMapping[mingguAktif] && tanggalMapping[mingguAktif][hari]) ? tanggalMapping[mingguAktif][hari] : "";
            const isWeekend = namaHariTampilan === "Minggu";
            const isPublic = isDayPublic(mingguAktif, hari);
            
            let cardHtml = `
                <div class="day-card ${isWeekend ? 'weekend' : ''} ${!isPublic ? 'card-private' : ''}">
                    <div class="day-title">
                        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                            <span>${namaHariTampilan}</span>
                            <span class="day-date">${tanggalTeks ? '📅 ' + tanggalTeks : ''}</span>
                            <span class="${isPublic ? 'status-pill-public' : 'status-pill-private'}">
                                ${isPublic ? '🌐 Publik' : '🔒 Privat'}
                            </span>
                        </div>
                        <button type="button" class="btn-toggle-public ${isPublic ? 'is-public' : 'is-private'}" onclick="togglePublicHari(${mingguAktif}, '${hari}')" title="${isPublic ? 'Publik: Klik untuk ubah ke Privat (sembunyi dari Tampilan Publik)' : 'Privat: Klik untuk ubah ke Publik (muncul di Tampilan Publik)'}">
                            ${isPublic ? '👁️ Publik (Buka)' : '👁️‍🗨️ Privat (Tutup)'}
                        </button>
                    </div>
                    <div class="activity-list">
            `;

            if (listKegiatan.length === 0) {
                cardHtml += `<p class="empty-state">Tidak ada kegiatan terjadwal.</p>`;
            } else {
                listKegiatan.forEach((item, index) => {
                    let badgeClass = "badge-libur";
                    let itemClass = "item-libur";
                    let badgeLabel = "🏖️ ISTIRAHAT";
                    let iconPrefix = "";

                    if (item.kategori === "latih") {
                        badgeClass = "badge-latih";
                        itemClass = "item-latih";
                        badgeLabel = "⚽ MELATIH";
                        iconPrefix = "⚽ ";
                    } else if (item.kategori === "magang") {
                        badgeClass = "badge-magang";
                        itemClass = "item-magang";
                        badgeLabel = "💼 MAGANG";
                        iconPrefix = "💼 ";
                    } else if (item.kategori === "kuliah") {
                        badgeClass = "badge-kuliah";
                        itemClass = "item-kuliah";
                        badgeLabel = "🎓 KULIAH";
                        iconPrefix = "🎓 ";
                    } else if (item.kategori === "bisnis") {
                        badgeClass = "badge-bisnis";
                        itemClass = "item-bisnis";
                        badgeLabel = "📈 BISNIS";
                        iconPrefix = "📈 ";
                    }

                    cardHtml += `
                        <div class="activity-item ${itemClass}">
                            <div class="activity-info">
                                <span class="activity-time">⏰ ${item.waktu}</span>
                                <span class="activity-name">${iconPrefix}${item.nama}</span>
                                <span class="badge ${badgeClass}">${badgeLabel}</span>
                            </div>
                            <div class="action-btns">
                                <button class="btn-action btn-edit" onclick="aktifkanEdit('${hari}', ${index})">✏️ Edit</button>
                                <button class="btn-action btn-delete" onclick="hapusKegiatan('${hari}', ${index})">🗑️ Hapus</button>
                            </div>
                        </div>
                    `;
                });
            }

            cardHtml += `</div></div>`;
            container.innerHTML += cardHtml;
        });
    }

    function simpanKegiatan() {
        let hari = document.getElementById("inputHari").value;
        const waktu = document.getElementById("inputWaktu").value.trim();
        const kegiatan = document.getElementById("inputKegiatan").value.trim();
        const kategori = document.getElementById("inputKategori").value;

        if (!waktu || !kegiatan) {
            alert("Mohon isi waktu dan nama kegiatan!");
            return;
        }

        if (mingguAktif === 5 && hari === "Senin") {
            if (confirm("Apakah kegiatan ini untuk Senin tanggal 24 atau Senin tanggal 31? Klik 'OK' untuk tanggal 31, atau 'Cancel' untuk tanggal 24.")) {
                hari = "Senin_31";
            }
        }

        const list = getDaftarKegiatan(mingguAktif, currentEditHari || hari);

        if (editMode && currentEditIndex !== null) {
            list.splice(currentEditIndex, 1);
            batalEdit();
        }

        const targetList = getDaftarKegiatan(mingguAktif, hari);
        targetList.push({
            waktu: waktu,
            nama: kegiatan,
            kategori: kategori
        });

        document.getElementById("inputWaktu").value = "";
        document.getElementById("inputKegiatan").value = "";

        simpanKeLokal();
        renderJadwal();
    }

    function aktifkanEdit(hari, index) {
        const list = getDaftarKegiatan(mingguAktif, hari);
        const item = list[index];
        if (!item) return;
        
        document.getElementById("inputHari").value = hari.startsWith("Senin") ? "Senin" : hari;
        document.getElementById("inputWaktu").value = item.waktu;
        document.getElementById("inputKegiatan").value = item.nama;
        document.getElementById("inputKategori").value = item.kategori;

        editMode = true;
        currentEditHari = hari;
        currentEditIndex = index;
        
        const namaHariTeks = hari.startsWith("Senin_31") ? "Senin (31 Ags)" : hari;
        document.getElementById("formTitle").innerText = `✏️ Edit Kegiatan (${bulanAktif}) Minggu ${mingguAktif} - ${namaHariTeks}`;
        document.getElementById("btnSimpan").innerText = "Perbarui Jadwal Minggu Ini";
        document.getElementById("btnBatal").style.display = "block";
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function batalEdit() {
        editMode = false;
        currentEditHari = "";
        currentEditIndex = null;
        
        document.getElementById("inputWaktu").value = "";
        document.getElementById("inputKegiatan").value = "";
        document.getElementById("formTitle").innerText = "➕ Tambah Kegiatan";
        document.getElementById("btnSimpan").innerText = "Simpan ke Jadwal Minggu Ini";
        document.getElementById("btnBatal").style.display = "none";
    }

    function hapusKegiatan(hari, index) {
        if (confirm(`Apakah kamu yakin ingin menghapus jadwal ini?`)) {
            const list = getDaftarKegiatan(mingguAktif, hari);
            list.splice(index, 1);
            if(editMode && currentEditHari === hari && currentEditIndex === index) {
                batalEdit();
            }
            simpanKeLokal();
            renderJadwal();
        }
    }

    function eksporExcel() {
        normalizeDatabaseStructure();
        let dataBentukExcel = [];
        
        for (let w = 1; w <= 5; w++) {
            let urutanHari = [...hariUrutanDasar];
            if (w === 5) urutanHari.push("Senin_31");

            urutanHari.forEach(hari => {
                const list = getDaftarKegiatan(w, hari);
                const tanggalTeks = (tanggalMapping[w] && tanggalMapping[w][hari]) ? tanggalMapping[w][hari] : "";
                const namaHariTampilan = hari.startsWith("Senin_31") ? "Senin" : hari;

                if(list.length === 0) {
                    dataBentukExcel.push({
                        "Bulan": bulanAktif,
                        "Minggu Ke": `Minggu ${w}`,
                        "Tanggal": tanggalTeks || "-",
                        "Hari": namaHariTampilan,
                        "Waktu": "-",
                        "Kegiatan / Agenda": "Tidak ada kegiatan",
                        "Kategori": "-"
                    });
                } else {
                    list.sort((a, b) => dapatkanMenitMulai(a.waktu) - dapatkanMenitMulai(b.waktu));
                    list.forEach(item => {
                        dataBentukExcel.push({
                            "Bulan": bulanAktif,
                            "Minggu Ke": `Minggu ${w}`,
                            "Tanggal": tanggalTeks || "-",
                            "Hari": namaHariTampilan,
                            "Waktu": item.waktu,
                            "Kegiatan / Agenda": item.nama,
                            "Kategori": item.kategori.toUpperCase()
                        });
                    });
                }
            });
        }

        const worksheet = XLSX.utils.json_to_sheet(dataBentukExcel);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, `Jadwal ${bulanAktif}`);

        const max_ops = [{wch: 15}, {wch: 12}, {wch: 12}, {wch: 10}, {wch: 15}, {wch: 45}, {wch: 12}];
        worksheet['!cols'] = max_ops;

        XLSX.writeFile(workbook, `Jadwal_${bulanAktif.replace(/\s+/g, '_')}.xlsx`);
    }

    gantiMinggu(1);
</script>
